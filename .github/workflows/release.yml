# Builds the downloadable game for Linux, Windows and macOS. A pushed v* tag
# also publishes all three on a GitHub release, where the README's download
# links point. Run by hand, it only builds them, as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/tetris-linux-x86_64
        run: packaging/linux/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-linux-x86_64
          path: dist/tetris-linux-x86_64
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/tetris-windows-x86_64.exe
        run: packaging/windows/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-windows-x86_64.exe
          path: dist/tetris-windows-x86_64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/tetris-macos.dmg
        run: packaging/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-macos.dmg
          path: dist/tetris-macos.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(dist/tetris-linux-x86_64 dist/tetris-windows-x86_64.exe dist/tetris-macos.dmg)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
