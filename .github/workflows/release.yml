# Builds the single-file Linux binary. A pushed v* tag also publishes it on a
# GitHub release, where the README's download link points.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/tetris-linux-x86_64
        run: packaging/linux/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-linux-x86_64
          path: dist/tetris-linux-x86_64
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/tetris-linux-x86_64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/tetris-linux-x86_64 \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
